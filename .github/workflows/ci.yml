name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # ──────────────────────────────────────────────
  # 1. Lint — fast feedback on code style
  # ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint check
        run: ruff check .

  # ──────────────────────────────────────────────
  # 2. Test — unit / integration tests via pytest
  # ──────────────────────────────────────────────
  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      # The suite runs fully offline: tests/conftest.py blanks GOOGLE_API_KEY so
      # LLMManager falls back to MockProvider and no paid call is ever made.
      APP_ENV: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-minilm-msmarco-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          export PYTHONPATH=.
          pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────
  # 2.5. Eval — retrieval and RAGAS metrics
  # ──────────────────────────────────────────────
  eval:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-minilm-msmarco-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest Test Data
        run: |
          export PYTHONPATH=.
          python scripts/ingest.py --source data/devdocs_ragas_eval_test_cases.pdf

      - name: Run evals
        run: |
          export PYTHONPATH=.
          python evals/run_evals.py

  # ──────────────────────────────────────────────
  # 3. Docker — build (and push on main) to GHCR
  # ──────────────────────────────────────────────
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name for Docker tags
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 4. Deploy — Azure App Service (main only)
  # ──────────────────────────────────────────────
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check Azure credentials
        id: check
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "⚠️  AZURE_CREDENTIALS not set — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Azure
        if: steps.check.outputs.skip != 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Lowercase repo name
        if: steps.check.outputs.skip != 'true'
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure App Service
        if: steps.check.outputs.skip != 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: devdocs-ai
          images: ghcr.io/${{ steps.repo.outputs.name }}:sha-${{ github.sha }}

