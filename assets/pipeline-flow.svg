 <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#171717"/></marker>
 <style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#111}.heading{font-size:23px;font-weight:800}.section{font-size:18px;font-weight:800}.label{font-size:15px;font-weight:700}.small{font-size:12px}.tiny{font-size:11px}.group{stroke:#444;stroke-width:1.6;stroke-dasharray:3 4}.box{stroke:#303030;stroke-width:1.5;filter:url(#shadow)}.wire{fill:none;stroke:#171717;stroke-width:2.4;stroke-dasharray:9 8;marker-end:url(#arrow);animation:dash 1.1s linear infinite}.solid{fill:none;stroke:#171717;stroke-width:2.2;marker-end:url(#arrow)}.packet{filter:url(#shadow)}.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes dash{to{stroke-dashoffset:-34}}@keyframes pulse{50%{opacity:.35;transform:scale(.72)}}@media(prefers-reduced-motion:reduce){.wire,.pulse{animation:none}.wire{stroke-dasharray:9 8}}
 </style>
</defs>
