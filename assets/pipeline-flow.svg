<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
<title id="title">DevDocs AI system architecture</title><desc id="desc">Animated technical architecture showing sources, ingestion, storage, API, retrieval, generation, client, sessions, and observability.</desc>
<defs>
